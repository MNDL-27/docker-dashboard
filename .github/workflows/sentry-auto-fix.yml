name: Sentry Auto-Remediation

on:
  repository_dispatch:
    types: [sentry_error]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Sentry Info
        run: |
          echo "Sentry reported an error in project: ${{ github.event.client_payload.project }}"
          echo "Error Message: ${{ github.event.client_payload.error_message }}"
          echo "Sentry URL: ${{ github.event.client_payload.issue_url }}"

      # Setup node/python if your agent requires it
      - name: Setup Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Agent
        env:
          # You must add this secret to your GitHub repository settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # ------------------------------------------------------------------
          # CHOOSE YOUR AGENT HERE
          # Uncomment the line for the agent you want to use (Hermes or Paperclip)
          # ------------------------------------------------------------------
          
          # Example 1: If using Paperclip CLI
          # npx paperclip fix "A Sentry error occurred: ${{ github.event.client_payload.error_message }}. Please analyze the codebase, fix the bug, and ensure tests pass."
          
          # Example 2: If using Hermes (assuming it's a CLI tool)
          # hermes agent run --prompt "A Sentry error occurred: ${{ github.event.client_payload.error_message }}. Please fix it."
          
          # Example 3: If using Aider (a very popular open-source auto-coding agent)
          # pip install aider-chat
          # aider --message "Fix this Sentry error: ${{ github.event.client_payload.error_message }}" --yes --auto-commits
          
          echo "Agent placeholder: Replace this echo with your agent's command."

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          title: "fix: auto-remediation for Sentry error"
          body: |
            Automated fix generated by AI Agent in response to a Sentry error.
            
            **Error Message:** `${{ github.event.client_payload.error_message }}`
            **Sentry Issue:** [View on Sentry](${!! github.event.client_payload.issue_url !!})
            
            Please review the changes before merging.
          branch: "auto-fix/sentry-${{ github.run_id }}"
          commit-message: "fix: resolve Sentry error"
          base: main
