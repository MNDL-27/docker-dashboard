[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 8080
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-:splat"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/auth-:splat"
  status = 200

# Catch-all rule for React Router (must be at the very bottom)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
