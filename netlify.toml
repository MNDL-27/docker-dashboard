[build]
  command = "npm run build && npm audit --audit-level=critical"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  framework = "#custom"
  command = "npm run dev:vite -- --port 8081"
  targetPort = 8081
  port = 8080

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://clerk.dockerdash.app https://*.clerk.accounts.dev https://js.sentry-cdn.com 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://clerk.dockerdash.app https://*.clerk.accounts.dev https://*.ingest.de.sentry.io wss://*.clerk.accounts.dev wss://clerk.dockerdash.app; frame-src 'self' https://clerk.dockerdash.app https://*.clerk.accounts.dev; img-src 'self' data: blob: https://img.clerk.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests; report-uri https://o4511412908261376.ingest.de.sentry.io/api/4511488947585104/csp-report/?sentry_key=5fbdc9857abd85c71e076b2d98297326"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Canonical domain: www.dockerdash.app → dockerdash.app (301)
[[redirects]]
  from = "/*"
  to = "https://dockerdash.app/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = "www.dockerdash.app"

# Docs domain: docs.dockerdash.app → serve /docs SPA (200 rewrite)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
  [redirects.conditions]
    Host = "docs.dockerdash.app"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-:splat"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/auth-:splat"
  status = 200

[[scheduled]]
  function = "api-donor-reminders"
  cron = "0 8 * * *"

[[scheduled]]
  function = "api-host-health-poll"
  cron = "* * * * *"

# Catch-all rule for React Router (must be at the very bottom)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
